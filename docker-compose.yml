services:
  nav:
    container_name: nav
    image: ghcr.io/1229984599/nav:latest
    environment:
      - TZ=Asia/Shanghai
      # 数据库配置（三选一）
      # SQLite（默认）
      - DATABASE_URI=sqlite:///app/data/data.db
      # MySQL
      # - DATABASE_URI=mysql://user:password@db-host:3306/nav
      # PostgreSQL
      # - DATABASE_URI=postgres://user:password@db-host:5432/nav
    ports:
      - "9000:80"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
